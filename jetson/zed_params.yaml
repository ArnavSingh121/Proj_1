# jetson/zed_params.yaml
# Overrides for the ZED ROS 2 wrapper (v5.5.0) on the drone: publish only what RTAB-Map uses
# (rectified RGB, depth registered to it, IMU, ZED odometry) and keep every other module off.
# Keys are checked against zed_wrapper/config/common_stereo.yaml; unknown keys are silently ignored.

---
/**:
    ros__parameters:
        general:
            grab_frame_rate: 30 # valid at every model's default resolution (ZED 2i defaults to 60)
            pub_resolution: 'CUSTOM' # publish downscaled images: less USB/CPU load for the Jetson
            pub_downscale_factor: 2.0 # e.g. ZED 2i HD720 -> 640x360, ZED X HD1200 -> 960x600
            pub_frame_rate: 15.0 # RTAB-Map input rate; must be <= grab_frame_rate
        video:
            publish_rgb: true
            publish_left_right: false
            publish_raw: false
            publish_gray: false
            publish_stereo: false
        sensors:
            publish_imu: true
            publish_imu_raw: false
            publish_mag: false
            publish_baro: false
            publish_temp: false
        depth:
            depth_mode: 'NEURAL_LIGHT' # SDK 5 only has neural depth modes; LIGHT is the one sized for Jetson
            min_depth: 0.3 # no depth closer than 30 cm (model default 0.01): keeps props/legs out of the map
            publish_depth_map: true
            publish_point_cloud: false # RTAB-Map builds its own cloud from RGB + depth
            publish_depth_confidence: false
            publish_disparity: false
        pos_tracking:
            pos_tracking_enabled: true # visual-inertial odometry for RTAB-Map (use_zed_odometry)
            imu_fusion: true
        mapping:
            mapping_enabled: false # RTAB-Map does the mapping
        object_detection:
            od_enabled: false
        body_tracking:
            bt_enabled: false
        stream_server:
            stream_enabled: false
